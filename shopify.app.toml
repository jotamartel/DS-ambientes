# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0fbf69f1998bfa24148bfdf913e7c006"
name = "DS Ambientes Projects"
application_url = "https://ds-ambientes.vercel.app"
embedded = false

# Sin esto, `shopify app deploy` publica solo las extensiones y NO envía esta
# configuración a Shopify. Eso dejó a la app registrada con los scopes viejos
# aunque el archivo declarara write_files, y ninguna reinstalación podía
# conceder un permiso que Shopify no tenía registrado.
[build]

[webhooks]
api_version = "2026-04"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,unauthenticated_read_product_listings,write_files"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://ds-ambientes.vercel.app/auth/callback" ]

[app_proxy]
url = "https://ds-ambientes.vercel.app/apps/projects"
subpath = "projects"
prefix = "apps"
